name: Release PLZ

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-plz:
    name: Release PLZ
    runs-on: ubuntu-24.04
    needs: ci
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/dkp-cli/src/cmd/webui/web/pnpm-lock.yaml
      - run: pnpm install
        working-directory: crates/dkp-cli/src/cmd/webui/web
      - run: pnpm build
        working-directory: crates/dkp-cli/src/cmd/webui/web
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Sync generated docs
        if: steps.release-plz.outputs.releases_created == 'true'
        run: |
          cargo docs
          if ! git diff --quiet -- docs/man docs/completions; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/man docs/completions
            git commit -s -m "chore: sync generated docs"
            git push
          fi
